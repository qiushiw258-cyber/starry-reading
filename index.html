<script type="text/babel">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

/* ══════════════════════════════════════════════
   1. 语音系统 — Azure 晓晓神经语音 + Web Speech 兜底
   ══════════════════════════════════════════════ */

// ★ 第一步：填入你的 Azure 语音服务密钥（见教程）
const AZURE_KEY    = '__AZURE_KEY__';
const AZURE_REGION = 'eastasia';

const synth = window.speechSynthesis;
let _zhVoice = null, _enVoice = null, _azAudio = null;

function escXml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;');
}

function stopSpeech() {
  if (_azAudio) { try { _azAudio.pause(); } catch(e){} _azAudio = null; }
  if (synth) synth.cancel();
}

// Azure 晓晓神经语音 — 温柔 gentle 风格，偏慢偏暖
async function _azureTTS(text, lang = 'zh') {
  if (!AZURE_KEY || AZURE_KEY === 'YOUR_KEY_HERE') return false;
  if (_azAudio) { try { _azAudio.pause(); } catch(e){} _azAudio = null; }
  const ssml = lang === 'zh'
    ? `<speak version='1.0' xmlns='http://www.w3.org/2001/10/synthesis' xmlns:mstts='http://www.w3.org/2001/mstts' xml:lang='zh-CN'><voice name='zh-CN-XiaoxiaoNeural'><mstts:express-as style='gentle'><prosody rate='-5%' pitch='+5%'>${escXml(text)}</prosody></mstts:express-as></voice></speak>`
    : `<speak version='1.0' xmlns='http://www.w3.org/2001/10/synthesis' xmlns:mstts='http://www.w3.org/2001/mstts' xml:lang='en-US'><voice name='en-US-JennyNeural'><mstts:express-as style='friendly'><prosody rate='-12%' pitch='+5%'>${escXml(text)}</prosody></mstts:express-as></voice></speak>`;
  try {
    const res = await fetch(`https://${AZURE_REGION}.tts.speech.microsoft.com/cognitiveservices/v1`, {
      method: 'POST',
      headers: {
        'Ocp-Apim-Subscription-Key': AZURE_KEY,
        'Content-Type': 'application/ssml+xml',
        'X-Microsoft-OutputFormat': 'audio-16khz-128kbitrate-mono-mp3',
      },
      body: ssml,
    });
    if (!res.ok) return false;
    const blob = new Blob([await res.arrayBuffer()], { type: 'audio/mpeg' });
    const url = URL.createObjectURL(blob);
    return await new Promise(resolve => {
      const audio = new Audio(url);
      _azAudio = audio;
      audio.onended = () => { URL.revokeObjectURL(url); _azAudio = null; resolve(true); };
      audio.onerror = () => { URL.revokeObjectURL(url); _azAudio = null; resolve(false); };
      audio.play().catch(() => { URL.revokeObjectURL(url); _azAudio = null; resolve(false); });
    });
  } catch(e) { return false; }
}

function loadVoices() {
  return new Promise(resolve => {
    const v = synth.getVoices();
    if (v.length) { resolve(v); return; }
    const h = () => resolve(synth.getVoices());
    synth.addEventListener('voiceschanged', h, { once: true });
    setTimeout(() => resolve(synth.getVoices()), 2500);
  });
}
async function getZhVoice() {
  if (_zhVoice) return _zhVoice;
  const vs = await loadVoices();
  _zhVoice =
    vs.find(v => v.name === 'Google 普通话（中国大陆）') ||
    vs.find(v => /xiaoxiao|晓晓/i.test(v.name) && v.lang.startsWith('zh')) ||
    vs.find(v => /microsoft.*zh|google.*zh/i.test(v.name)) ||
    vs.find(v => v.lang === 'zh-CN' && v.localService === false) ||
    vs.find(v => v.lang === 'zh-CN') ||
    vs.find(v => v.lang.startsWith('zh')) || null;
  return _zhVoice;
}
async function getEnVoice() {
  if (_enVoice) return _enVoice;
  const vs = await loadVoices();
  _enVoice =
    vs.find(v => /google us english/i.test(v.name)) ||
    vs.find(v => /samantha|aria|zira|microsoft.*en/i.test(v.name)) ||
    vs.find(v => v.lang === 'en-US' && v.localService === false) ||
    vs.find(v => v.lang === 'en-US') ||
    vs.find(v => v.lang.startsWith('en')) || null;
  return _enVoice;
}

// 中文语音 — 优先 Azure 晓晓，兜底 Web Speech
async function speak(text, opts = {}) {
  stopSpeech();
  if (await _azureTTS(text, 'zh')) return;
  return new Promise(async resolve => {
    if (!synth) { resolve(); return; }
    const u = new SpeechSynthesisUtterance(text);
    const v = await getZhVoice();
    if (v) u.voice = v;
    u.lang = 'zh-CN'; u.pitch = opts.pitch ?? 1.08; u.rate = opts.rate ?? 0.90; u.volume = 1.0;
    u.onend = resolve; u.onerror = resolve;
    synth.speak(u);
  });
}

// 英文绘本朗读 — 优先 Azure Aria，兜底 Web Speech
async function speakEn(text, opts = {}) {
  stopSpeech();
  if (await _azureTTS(text, 'en')) return;
  return new Promise(async resolve => {
    if (!synth) { resolve(); return; }
    const u = new SpeechSynthesisUtterance(text);
    const v = await getEnVoice();
    if (v) u.voice = v;
    u.lang = 'en-US'; u.pitch = opts.pitch ?? 1.08; u.rate = opts.rate ?? 0.80; u.volume = 1.0;
    u.onend = resolve; u.onerror = resolve;
    synth.speak(u);
  });
}

/* ══════════════════════════════════════════════
   2. 麦克风 / 语音识别
   ══════════════════════════════════════════════ */
const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;

function listenOnce(lang = 'en-US', ms = 13000) {
  return new Promise((resolve, reject) => {
    if (!Recognition) { reject({ error: 'not-supported' }); return; }
    const rec = new Recognition();
    rec.lang = lang; rec.continuous = false; rec.interimResults = false; rec.maxAlternatives = 3;
    let done = false;
    const finish = fn => { if (!done) { done = true; clearTimeout(t); fn(); } };
    const t = setTimeout(() => finish(() => resolve('')), ms);
    rec.onresult = e => finish(() => resolve(Array.from(e.results).map(r => r[0].transcript).join(' ').trim()));
    rec.onerror  = e => finish(() => e.error === 'no-speech' ? resolve('') : reject(e));
    try { rec.start(); } catch(e) { finish(() => reject(e)); }
  });
}

/* ══════════════════════════════════════════════
   3. 错误检测
   ══════════════════════════════════════════════ */
function normWord(w) { return w.toLowerCase().replace(/[^a-z']/g, ''); }
function lev(a, b) {
  if (!a.length) return b.length; if (!b.length) return a.length;
  const row = Array.from({length: b.length+1}, (_,i) => i);
  for (let i=1; i<=a.length; i++) {
    let prev = i;
    for (let j=1; j<=b.length; j++) {
      const val = a[i-1]===b[j-1] ? row[j-1] : 1+Math.min(prev,row[j],row[j-1]);
      row[j-1]=prev; prev=val;
    }
    row[b.length]=prev;
  }
  return row[b.length];
}
function wordsMatch(e, h) {
  const ev=normWord(e), hv=normWord(h);
  if (!ev) return true; if (ev===hv) return true;
  return lev(ev,hv) <= (ev.length<=3?1:2);
}
function detectErrors(expected, heard) {
  const strip = s => s.replace(/["""''.,!?;:()\-]/g,'').trim();
  const ew = strip(expected).split(/\s+/).filter(Boolean);
  const hw = strip(heard).split(/\s+/).filter(Boolean);
  return ew.map((w,i)=>({word:w,index:i,heard:hw[i]||''})).filter(({word,heard})=>!wordsMatch(word,heard));
}

/* ══════════════════════════════════════════════
   4. 横竖屏
   ══════════════════════════════════════════════ */
function useOrientation() {
  const get = () => typeof window!=='undefined' && window.innerWidth>window.innerHeight && window.innerHeight>=380;
  const [land, setLand] = useState(get);
  useEffect(() => {
    const on = () => setLand(get());
    window.addEventListener('resize', on); window.addEventListener('orientationchange', on);
    return () => { window.removeEventListener('resize',on); window.removeEventListener('orientationchange',on); };
  }, []);
  return land;
}

/* ══════════════════════════════════════════════
   5. 七日星星 — localStorage 持久化 + 真实星期
   ══════════════════════════════════════════════ */
function getTodayIdx() {
  const d = new Date().getDay(); // 0=Sun
  return d===0 ? 6 : d-1;       // Mon=0 … Sun=6
}
function getWeekKey() {
  const d = new Date();
  const jan1 = new Date(d.getFullYear(), 0, 1);
  const wk = Math.ceil(((d-jan1)/864e5 + jan1.getDay()+1)/7);
  return `sr-stars-${d.getFullYear()}-W${wk}`;
}
function loadStars() {
  try { const s=localStorage.getItem(getWeekKey()); return s?JSON.parse(s):Array(7).fill(false); }
  catch { return Array(7).fill(false); }
}
function saveStars(arr) {
  try { localStorage.setItem(getWeekKey(), JSON.stringify(arr)); } catch {}
}

// Google Books API 搜索（免费，无需 key，CORS 开放）
async function searchGoogleBooks(q) {
  try {
    const url = `https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(q)}&maxResults=6&printType=books`;
    const res = await fetch(url);
    if (!res.ok) return [];
    const data = await res.json();
    if (!data.items) return [];
    return data.items.map(item => {
      const info = item.volumeInfo;
      return {
        id: item.id,
        title: info.title || '未知书名',
        author: info.authors?.[0] || '',
        cover: (info.imageLinks?.thumbnail || info.imageLinks?.smallThumbnail || '').replace('http:', 'https:'),
        isbn: info.industryIdentifiers?.find(i=>i.type==='ISBN_13')?.identifier || '',
        description: info.description || '',
        isApi: true,
      };
    });
  } catch { return []; }
}

/* ══════════════════════════════════════════════
   9. 封面扫描弹窗（摄像头 + BarcodeDetector）
   ══════════════════════════════════════════════ */
function CameraScanner({ onFound, onClose }) {
  const videoRef = useRef();
  const [phase,   setPhase]   = useState('starting'); // starting|scanning|found|error|no-camera
  const [result,  setResult]  = useState(null);
  const [errMsg,  setErrMsg]  = useState('');

  useEffect(() => {
    let stream, timer, live = true;

    const startCamera = async () => {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode:'environment', width:{ideal:1280} } });
        if (!live) { stream.getTracks().forEach(t=>t.stop()); return; }
        videoRef.current.srcObject = stream;
        await videoRef.current.play();
        setPhase('scanning');
        scanLoop();
      } catch(e) {
        if (!live) return;
        if (e.name === 'NotAllowedError') { setErrMsg('摄像头权限被拒绝，请在浏览器设置中允许'); }
        else { setErrMsg('无法启动摄像头，请手动搜索书名'); }
        setPhase('error');
      }
    };

    const scanLoop = async () => {
      if (!live) return;
      // Try BarcodeDetector (Chrome 83+)
      if ('BarcodeDetector' in window) {
        try {
          const det = new BarcodeDetector({ formats:['ean_13','ean_8','qr_code','code_128'] });
          const tryDetect = async () => {
            if (!live) return;
            try {
              const codes = await det.detect(videoRef.current);
              if (codes.length > 0) {
                const raw = codes[0].rawValue;
                setPhase('found');
                await speak('发现了条形码！正在联网查找这本书～');
                const books = await searchGoogleBooks(`isbn:${raw}`);
                if (!live) return;
                if (books.length > 0) {
                  setResult(books[0]);
                } else {
                  setErrMsg(`ISBN ${raw} 暂未收录，请搜索书名`);
                  setPhase('error');
                }
                return;
              }
            } catch {}
            if (live) timer = setTimeout(tryDetect, 600);
          };
          tryDetect();
        } catch {
          setPhase('error');
          setErrMsg('暂不支持自动识别，请手动搜索书名');
        }
      } else {
        setErrMsg('当前浏览器不支持条码识别，请手动搜索书名');
        setPhase('error');
      }
    };

    startCamera();
    return () => { live=false; clearTimeout(timer); stream?.getTracks().forEach(t=>t.stop()); };
  }, []);

  const overlayStyle = { position:'fixed', inset:0, background:'rgba(10,20,48,.85)', backdropFilter:'blur(6px)', WebkitBackdropFilter:'blur(6px)', zIndex:80, display:'flex', alignItems:'center', justifyContent:'center', padding:20, animation:'fade-in .3s' };
  const boxStyle = { background:'rgba(255,255,255,.95)', borderRadius:28, padding:24, maxWidth:360, width:'100%', textAlign:'center', boxShadow:'0 24px 48px rgba(10,20,48,.5)', animation:'pop-in .4s cubic-bezier(.34,1.56,.64,1)' };

  return (
    <div style={overlayStyle}>
      <div style={boxStyle}>
        <div style={{fontFamily:"'ZCOOL KuaiLe',sans-serif",fontSize:18,color:'var(--ink)',marginBottom:16}}>
          {phase==='starting'  && '📷 正在启动摄像头…'}
          {phase==='scanning'  && '📷 将书的封面条码对准摄像头'}
          {phase==='found'     && '🔍 正在联网查找…'}
          {phase==='error'     && '⚠️ ' + errMsg}
          {result              && `✅ 找到了：${result.title}`}
        </div>

        {(phase==='starting'||phase==='scanning'||phase==='found')&&!result&&(
          <div style={{position:'relative',borderRadius:16,overflow:'hidden',marginBottom:16,background:'#000',aspectRatio:'4/3'}}>
            <video ref={videoRef} style={{width:'100%',display:'block'}} muted playsInline/>
            {phase==='scanning'&&(
              <div style={{position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'center'}}>
                <div style={{width:'70%',height:'30%',border:'2px solid rgba(255,217,102,.8)',borderRadius:8,position:'relative'}}>
                  <div style={{position:'absolute',left:0,right:0,height:2,background:'linear-gradient(90deg,transparent,rgba(255,217,102,.9),transparent)',animation:'scan-sweep 2s ease-in-out infinite'}}/>
                </div>
              </div>
            )}
            {phase==='found'&&(
              <div style={{position:'absolute',inset:0,background:'rgba(10,20,48,.6)',display:'flex',alignItems:'center',justifyContent:'center'}}>
                <div style={{width:40,height:40,border:'4px solid var(--gold)',borderTopColor:'transparent',borderRadius:'50%',animation:'spin .8s linear infinite'}}/>
              </div>
            )}
          </div>
        )}

        {result&&(
          <div style={{marginBottom:16}}>
            {result.cover&&<img src={result.cover} style={{height:120,borderRadius:10,boxShadow:'0 6px 16px rgba(0,0,0,.2)',marginBottom:10}} alt="cover"/>}
            <div style={{fontFamily:"'Baloo 2',sans-serif",fontWeight:700,fontSize:16,color:'var(--ink)'}}>{result.title}</div>
            {result.author&&<div style={{fontFamily:'Fredoka',fontSize:13,color:'var(--ink-soft)',marginTop:4}}>{result.author}</div>}
            <button onClick={()=>onFound(result)} style={{marginTop:14,background:'linear-gradient(165deg,#FFE9A8,#FFD966 50%,#F5B942)',color:'#5C3A1E',border:'none',padding:'12px 32px',borderRadius:16,fontFamily:"'ZCOOL KuaiLe',sans-serif",fontSize:15,fontWeight:700,cursor:'pointer',boxShadow:'0 6px 14px rgba(245,185,66,.4)'}}>
              开始阅读 →
            </button>
          </div>
        )}

        <button onClick={onClose} style={{background:'transparent',border:'1px dashed rgba(100,120,160,.4)',borderRadius:12,padding:'6px 20px',fontFamily:"'ZCOOL KuaiLe',sans-serif",fontSize:13,color:'var(--ink-soft)',cursor:'pointer'}}>
          关闭，手动搜索
        </button>
      </div>
    </div>
  );
}

function HomeScreen({ isLandscape, onPickBook, onOpenCamera, query, setQuery, starProps }) {
  const [apiResults, setApiResults] = useState([]);
  const [loading,    setLoading]    = useState(false);
  const timerRef = useRef();

  // 防抖搜索：本地 + Google Books API
  useEffect(() => {
    clearTimeout(timerRef.current);
    if (!query.trim()) { setApiResults([]); return; }
    timerRef.current = setTimeout(async () => {
      setLoading(true);
      const res = await searchGoogleBooks(query.trim());
      setApiResults(res);
      setLoading(false);
    }, 600);
    return () => clearTimeout(timerRef.current);
  }, [query]);

  const localMatches = query.trim()
    ? Object.keys(LOCAL_BOOKS).filter(t => t.toLowerCase().includes(query.toLowerCase()))
    : Object.keys(LOCAL_BOOKS);

  const hasResults = localMatches.length > 0 || apiResults.length > 0;

  const bookGrid = (
    <div>
      <div style={{fontFamily:"'ZCOOL KuaiLe',sans-serif",fontSize:14,color:'var(--cream)',margin:'6px 4px 8px',textShadow:'0 1px 3px rgba(0,0,0,.4)',letterSpacing:1}}>
        {query.trim() ? (loading ? '搜索中…' : `共找到 ${localMatches.length + apiResults.length} 本`) : '今夜书单 · TONIGHT'}
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:12}}>
        {localMatches.map(t=><LocalBookCard key={t} title={t} onClick={()=>onPickBook({local:true,title:t})}/>)}
        {apiResults.map(b=><ApiBookCard key={b.id} book={b} onClick={()=>onPickBook({local:false,...b})}/>)}
        {query.trim() && !hasResults && !loading && (
          <div style={{gridColumn:'span 3',textAlign:'center',padding:'20px 0',fontFamily:"'ZCOOL KuaiLe',sans-serif",fontSize:14,color:'rgba(245,237,214,.6)'}}>未找到相关绘本</div>
        )}
      </div>
    </div>
  );

  if (!isLandscape) return (
    <div style={{padding:'0 16px',display:'flex',flexDirection:'column',gap:16,position:'relative',zIndex:2}}>
      <Greeting/>

/* ── 纠错弹窗 ── */
function CorrectionOverlay({ word, onDone }) {
  const [phase, setPhase] = useState('demo');
  const cancelRef = useRef(false);
  useEffect(() => {
    cancelRef.current = false;
    (async () => {
      await speak('这里有个小单词可以读得更标准哦，我们一起学一下吧～');
      if (cancelRef.current) return;
      await speakEn(word, { rate:.65, pitch:1.1 });
      if (cancelRef.current) return;
      await speak('现在轮到你啦，跟着我读一遍～');
      if (cancelRef.current) return;
      setPhase('listen');
      try {
        const h1 = await listenOnce('en-US', 8000);
        if (cancelRef.current) return;
        if (h1 && wordsMatch(word, h1)) {
          setPhase('ok'); await speak('太棒了！发音越来越标准啦！');
          if (!cancelRef.current) setTimeout(onDone, 700);
        } else {
          await speakEn(word, {rate:.58}); if (cancelRef.current) return;
          await speak('再试一次，你可以的～'); if (cancelRef.current) return;
          const h2 = await listenOnce('en-US', 8000);
          if (cancelRef.current) return;
          if (h2 && wordsMatch(word, h2)) { setPhase('ok'); await speak('你真棒！'); if (!cancelRef.current) setTimeout(onDone, 600); }
          else { await speak('没关系，继续加油！'); if (!cancelRef.current) setTimeout(onDone, 600); }
        }
      } catch { if (!cancelRef.current) setTimeout(onDone, 400); }
    })();
    return () => { cancelRef.current=true; synth?.cancel(); };
  }, [word]);
  return (
    <div style={{position:'fixed',inset:0,background:'rgba(10,20,48,.75)',backdropFilter:'blur(5px)',WebkitBackdropFilter:'blur(5px)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:60,animation:'fade-in .3s',padding:20}}>
      <div style={{background:'linear-gradient(165deg,rgba(255,255,255,.97),rgba(245,237,214,.95))',backdropFilter:'blur(20px)',borderRadius:28,padding:'30px 28px',textAlign:'center',maxWidth:320,width:'100%',boxShadow:'0 24px 48px rgba(10,20,48,.5)',border:'1px solid rgba(255,255,255,.65)',animation:'pop-in .4s cubic-bezier(.34,1.56,.64,1)'}}>
        {phase==='ok'?(
          <><div style={{fontSize:56,marginBottom:10,animation:'star-appear .5s'}}>⭐</div><div style={{fontFamily:"'ZCOOL KuaiLe',sans-serif",fontSize:22,color:'var(--ink)'}}>读对啦！真棒！</div></>
        ):(
          <>
            <div style={{fontSize:12,fontFamily:'Fredoka',fontWeight:600,color:'var(--ink-soft)',letterSpacing:1,marginBottom:10}}>PRACTICE THIS WORD</div>
            <div style={{fontFamily:"'Baloo 2',sans-serif",fontWeight:800,fontSize:42,color:'var(--night)',marginBottom:8}}>{word}</div>
            <div style={{height:32,display:'flex',alignItems:'center',justifyContent:'center',marginBottom:12}}>
              {phase==='listen'?<div style={{display:'flex',alignItems:'center',gap:4,height:28}}>{[0,.1,.2,.1,0].map((d,i)=><div key={i} style={{width:6,height:28,borderRadius:3,background:'var(--gold-deep)',transformOrigin:'center bottom',animation:`wave .65s ${d}s ease-in-out infinite`}}/>)}</div>:<div style={{fontFamily:"'ZCOOL KuaiLe',sans-serif",fontSize:14,color:'var(--ink-soft)'}}>🔊 AI 示范读音…</div>}
            </div>
            <div style={{fontFamily:"'ZCOOL KuaiLe',sans-serif",fontSize:15,color:phase==='listen'?'var(--gold-deep)':'var(--ink-soft)',marginBottom:16}}>
              {phase==='listen'?'🎤 轮到你啦，大声读出来～':'先认真听 AI 读一遍…'}
            </div>
            <button onClick={()=>{cancelRef.current=true;synth?.cancel();onDone();}} style={{background:'transparent',border:'1px dashed rgba(100,120,160,.4)',borderRadius:12,padding:'6px 20px',fontFamily:"'ZCOOL KuaiLe',sans-serif",fontSize:12,color:'var(--ink-soft)',cursor:'pointer'}}>跳过这个单词</button>
          </>
        )}
      </div>
    </div>
  );
}

/* ── 阅读主屏 ── */
function ReadingScreen({ isLandscape, bookData, onBack, onFinish, starProps }) {
  const local     = bookData.local ? LOCAL_BOOKS[bookData.title] : null;
  const rawPages  = local?.pages || [{en:'', desc:bookData.description||'请自由朗读这本书的内容。', zh:''}];
  const [pageIdx,    setPageIdx]    = useState(0);
  const [mode,       setMode]       = useState(null);
  const [aiSpeaking, setAiSpeaking] = useState(false);
  const [showZh,     setShowZh]     = useState(false);
  const [micStatus,  setMicStatus]  = useState('off');
  const [banner,     setBanner]     = useState('');
  const [errorWords, setErrorWords] = useState([]);
  const [pending,    setPending]    = useState([]);
  const [correcting, setCorrecting] = useState(null);
  const [pageDone,   setPageDone]   = useState(false);
  const [busy,       setBusy]       = useState(false);

  const total  = rawPages.length;
  const page   = rawPages[pageIdx];
  const isLast = pageIdx === total - 1;
  const isFirst= pageIdx === 0;
  const freeRead = !page.en; // API 书，没有可对比的文字

  // 每页进入时语音引导
  useEffect(() => {
    let live = true;
    (async () => {
      await new Promise(r=>setTimeout(r,400));
      if (!live) return;
      const msg = '小朋友，现在你可以大声读这一页啦，我会认真听的！';
      setBanner(msg); await speak(msg); if (live) setBanner('');
    })();
    return ()=>{ live=false; };
  }, [pageIdx]);

  const resetPage = () => {
    setMode(null); setAiSpeaking(false); setShowZh(false);
    setMicStatus('off'); setBanner(''); setErrorWords([]);
    setPending([]); setCorrecting(null); setPageDone(false); setBusy(false);
  };

  /* AI 领读 */
  const handleAI = async () => {
    if (busy) return;
    setBusy(true); setMode('ai'); setAiSpeaking(true);
    setBanner('AI 领读中，跟着一起读吧～');
    const text = page.en || page.desc || bookData.title;
    await speakEn(text, {rate:.82, pitch:1.05});
    setAiSpeaking(false); setMode(null); setBanner(''); setBusy(false);
  };

  /* 我来读 */
  const handleMe = async () => {
    if (busy) return;
    setBusy(true); setMode('me'); setMicStatus('active');
    setBanner('需要你的麦克风权限，这样我才能听到你读书哦～');
    await speak('我在听呢，慢慢读～');
    setMicStatus('listening'); setBanner('正在倾听中…');
    try {
      const heard = await listenOnce('en-US', 13000);
      setMicStatus('off'); setMode(null); setBanner('');
      if (!heard) { await speak('我好像没有听到，再试一次吧～'); setBusy(false); return; }
      if (freeRead) {
        // 没有参考文本，直接鼓励
        const praise='哇！你读得真棒！继续加油！'; setBanner(praise);
        await speak(praise); setBanner(''); setPageDone(true);
      } else {
        const errs = detectErrors(page.en, heard);
        if (errs.length===0) {
          const praise='哇！你读得超流利，太厉害了！这页读得很流畅，进步好大！';
          setBanner(praise); await speak(praise); setBanner(''); setPageDone(true);
        } else {
          setErrorWords(errs.map(e=>normWord(e.word)));
          setPending([...errs]); setCorrecting(errs[0]);
        }
      }
    } catch(err) {
      setMicStatus('off'); setMode(null); setBanner('');
      if (err?.error==='not-allowed'||err?.name==='NotAllowedError') {
        setMicStatus('denied'); await speak('我听不到你的声音啦，请帮我打开麦克风权限吧～');
        setBanner('请在浏览器中允许麦克风权限');
      } else { await speak('出现了小问题，再试一次吧～'); }
    }
    setBusy(false);
  };

  const afterCorrection = async () => {
    setCorrecting(null);
    const rest = pending.slice(1);
    if (rest.length===0) {
      setErrorWords([]); setPending([]);
      const msg='错误都改正啦，继续加油！'; setBanner(msg);
      await speak(msg); setBanner(''); setPageDone(true);
    } else {
      setPending(rest); setErrorWords(rest.map(e=>normWord(e.word))); setCorrecting(rest[0]);
    }
  };

  const handleNext = () => { setPageDone(false); if (isLast) onFinish(); else { setPageIdx(i=>i+1); resetPage(); } };
  const handlePrev = () => { if (!isFirst) { setPageIdx(i=>i-1); resetPage(); } };
  const handleReread = async () => {
    setPageDone(false); setErrorWords([]); setPending([]);
    const msg='来，再读一遍，你一定会读得更棒！'; setBanner(msg); await speak(msg); setBanner('');
  };

  const readBtns = (
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
      <ActionButton icon="🎤" label="我来读" sub="Read aloud" kind="mic" active={mode==='me'} onClick={handleMe} disabled={busy&&mode!=='me'}/>
      <ActionButton icon="🔊" label="听AI读" sub="Listen"     kind="ai"  active={mode==='ai'} onClick={handleAI} disabled={busy&&mode!=='ai'}/>
    </div>
  );
  const navBtns = (
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
      <button onClick={handlePrev} disabled={isFirst} style={{padding:'14px',borderRadius:18,border:'1px solid rgba(255,255,255,.5)',background:'rgba(255,255,255,.78)',backdropFilter:'blur(10px)',WebkitBackdropFilter:'blur(10px)',color:isFirst?'rgba(74,90,130,.35)':'var(--ink)',fontFamily:"'ZCOOL KuaiLe',sans-serif",fontSize:16,fontWeight:700,cursor:isFirst?'not-allowed':'pointer',opacity:isFirst?.5:1,boxShadow:isFirst?'none':'0 6px 14px rgba(10,20,48,.2)'}}>← 上一页</button>
      <button onClick={handleNext} style={{padding:'14px',borderRadius:18,border:'1px solid rgba(255,217,102,.6)',background:isLast?'linear-gradient(165deg,#FFE9A8,#FFD966 50%,#F5B942)':'linear-gradient(165deg,rgba(255,233,168,.95),rgba(255,217,102,.95))',color:'#5C3A1E',fontFamily:"'ZCOOL KuaiLe',sans-serif",fontSize:16,fontWeight:700,cursor:'pointer',boxShadow:'0 8px 18px rgba(245,185,66,.45)',letterSpacing:.5}}>
        {isLast?'✦ 读完啦':'下一页 →'}
      </button>
    </div>
  );

  const portrait = (
    <div style={{padding:'0 16px',display:'flex',flexDirection:'column',gap:12,position:'relative',zIndex:2}}>
      <ReadingTopBar bookTitle={bookData.title} pageIdx={pageIdx} total={total} onBack={onBack}/>
      <PageCard bookData={bookData} page={page} aiSpeaking={aiSpeaking} mode={mode} showZh={showZh} setShowZh={setShowZh} isLandscape={false} errorWords={errorWords}/>
      <MicWidget status={micStatus}/>
      {banner&&<VoiceBanner text={banner}/>}
      {readBtns}{navBtns}
      <StarRow {...starProps} locked/>
    </div>
  );

  const landscape = (
    <div style={{display:'grid',gridTemplateColumns:'60% 40%',gap:20,padding:'0 18px 18px',minHeight:'calc(100vh - 100px)',position:'relative',zIndex:2}}>
      <div style={{display:'flex',flexDirection:'column',minWidth:0}}>
        <ReadingTopBar bookTitle={bookData.title} pageIdx={pageIdx} total={total} onBack={onBack}/>
        <PageCard bookData={bookData} page={page} aiSpeaking={aiSpeaking} mode={mode} showZh={showZh} setShowZh={setShowZh} isLandscape={true} errorWords={errorWords}/>
      </div>
      <div style={{display:'flex',flexDirection:'column',gap:12,minWidth:0,paddingTop:4}}>
        <div style={{fontFamily:"'ZCOOL KuaiLe',sans-serif",fontSize:14,color:'var(--cream)',padding:'0 4px',textShadow:'0 1px 3px rgba(0,0,0,.4)',letterSpacing:1}}>朗读方式 · READING</div>
        {readBtns}<MicWidget status={micStatus}/>{banner&&<VoiceBanner text={banner}/>}{navBtns}
        <div style={{flex:1}}/><StarRow {...starProps} compact locked/>
      </div>
    </div>
  );

  return (
    <>{isLandscape?landscape:portrait}
      {correcting&&<CorrectionOverlay word={correcting.word} onDone={afterCorrection}/>}
      {pageDone&&<PageDoneOverlay isLast={isLast} onNext={handleNext} onReread={handleReread}/>}
    </>
  );
}

  const [bookData,    setBookData]   = useState(null);
  const [query,       setQuery]      = useState('');
  const [done,        setDone]       = useState(() => loadStars()); // localStorage 加载
  const [celebrate,   setCelebrate]  = useState(false);
  const [showCamera,  setShowCamera] = useState(false);

  // 预加载语音
  useEffect(() => { loadVoices(); }, []);

  // 每次 done 改变时持久化
  useEffect(() => { saveStars(done); }, [done]);

  const pickBook = async (data) => {
    setBookData(data);
    setScreen('read');
  };

  const finishReading = async () => {
    // 点亮今日星星（仅当今日未点亮）
    if (!done[todayIdx]) {
      const next = [...done]; next[todayIdx] = true; setDone(next);
    }
    await speak('恭喜你！读完了一整本绘本，今天的星星点亮啦！你真的太棒了！');
    setCelebrate(true);
  };

  const handleCameraFound = async (apiBook) => {
    setShowCamera(false);
    // 如果是我们库里有的书，用本地数据
    const localMatch = Object.keys(LOCAL_BOOKS).find(t => t.toLowerCase().includes(apiBook.title.toLowerCase().slice(0,8)));
    if (localMatch) {
      pickBook({ local:true, title:localMatch });
    } else {
      pickBook({ local:false, ...apiBook });
    }
  };

  const starProps = {
    done, todayIdx,
    onToggle: () => {}, // 锁定：只能通过读完书点亮
  };

  return (
    <>
      <StarryBackground/>
      <Ornaments/>
      <div style={{width:'100%',maxWidth:isLandscape?1100:480,minHeight:'100vh',paddingBottom:isLandscape?0:20,display:'flex',flexDirection:'column',position:'relative',zIndex:2}}>
        <Header compact={isLandscape}/>
        <div style={{flex:1,display:'flex',flexDirection:'column'}}>
          {screen==='home'&&(
            <HomeScreen
              isLandscape={isLandscape}
              onPickBook={pickBook}
              onOpenCamera={()=>setShowCamera(true)}
              query={query} setQuery={setQuery}
              starProps={starProps}
            />
          )}
          {screen==='read'&&bookData&&(
            <ReadingScreen
              isLandscape={isLandscape}
              bookData={bookData}
              onBack={()=>{ setScreen('home'); setBookData(null); }}
              onFinish={finishReading}
              starProps={starProps}
            />
          )}
        </div>
        {celebrate&&<Celebration onClose={()=>{ setCelebrate(false); setScreen('home'); setBookData(null); }}/>}
      </div>

      {/* 摄像头扫描弹窗 */}
      {showCamera&&<CameraScanner onFound={handleCameraFound} onClose={()=>setShowCamera(false)}/>}

      <style>{`
        @keyframes twinkle    { 0%,100%{opacity:.3;transform:scale(.9)} 50%{opacity:1;transform:scale(1.15)} }
        @keyframes gold-pulse { 0%,100%{opacity:.65;transform:scale(1)} 50%{opacity:1;transform:scale(1.18)} }
        @keyframes sparkle    { 0%,100%{opacity:0;transform:scale(.5)} 50%{opacity:1;transform:scale(1.4)} }
        @keyframes mic-pulse  { 0%,100%{opacity:.5;transform:scale(1)} 50%{opacity:.9;transform:scale(1.06)} }
        @keyframes mic-ring   { 0%{transform:scale(1);box-shadow:0 0 0 0 rgba(255,217,102,.6)} 70%{transform:scale(1.08);box-shadow:0 0 0 14px rgba(255,217,102,0)} 100%{transform:scale(1)} }
        @keyframes word-pop   { 0%{transform:scale(1);color:var(--ink)} 30%{transform:scale(1.12);color:var(--gold-deep);text-shadow:0 0 12px rgba(255,217,102,.6)} 100%{transform:scale(1);color:var(--ink)} }
        @keyframes eq         { 0%,100%{height:4px} 50%{height:20px} }
        @keyframes wave       { 0%,100%{transform:scaleY(.25)} 50%{transform:scaleY(1)} }
        @keyframes fade-in    { from{opacity:0} to{opacity:1} }
        @keyframes pop-in     { 0%{transform:scale(.6);opacity:0} 100%{transform:scale(1);opacity:1} }
        @keyframes star-appear{ 0%{transform:scale(0) rotate(-30deg);opacity:0} 60%{transform:scale(1.3) rotate(10deg);opacity:1} 100%{transform:scale(1) rotate(0);opacity:1} }
        @keyframes banner-in  { from{opacity:0;transform:translateY(-6px)} to{opacity:1;transform:translateY(0)} }
        @keyframes scan-sweep { 0%{top:0;opacity:1} 90%{top:90%;opacity:1} 100%{top:90%;opacity:0} }
        @keyframes spin       { to{transform:rotate(360deg)} }
      `}</style>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</head>
<body>
  <div id="root"></div>
</body>
</html>
